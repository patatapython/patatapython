# Single source for the profile README and every image it shows.
# Edit this file, then run: python3 tools/build.py
# Card body lines are wrapped by hand; build.py refuses lines that would overflow.
# Each card shows a screenshot from media/: focus is the point to keep in view
# (0-1 from the top left), zoom crops tighter, fit = "contain" shows it whole.

[person]
name = "Guillermo Manzanares"
role = "Software & Applied AI Engineer"
tagline = "Ten years in industrial automation. Now I build software that runs in production."
linkedin = "https://www.linkedin.com/in/guillermomanzanares"
website = "https://epitrixconsulting.com"

intro = [
  "I build software and AI systems that solve one concrete problem, and I take them to production.",
  "Agricultural engineer by training, I spent ten years automating a food-processing plant before an MSc in Big Data and Data Science (neural networks and deep learning) took me into AI. Since 2026 I work on my own as a software and AI engineer.",
  "I'm looking for an AI, data or software team where I can build systems people actually use, and learn from engineers with more road behind them.",
]

how_i_work = [
  "Tests from the start, continuous integration, Docker, and strict typing where it matters.",
  "AI-assisted development with Claude Code, with review and tests for everything that goes in. The architecture, product and stack decisions are mine.",
]

toolbox = ["Python", "FastAPI", "PostgreSQL", "Docker", "LangChain", "LangGraph", "RAG", "Qdrant",
           "YOLO", "OpenCV", "pytest", "GitHub Actions", "Linux", "SCADA"]

private_note = "Most of my work is client software and lives in private repositories. What is public are finished portfolio versions, which is why some of them have few commits. Happy to walk through any of this code in as much depth as you want."

